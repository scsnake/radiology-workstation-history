<html>
<head>
<title>YCH</title>
<script type="text/javascript">
var param='?SESSION=MOCK_SESSION_TOKEN';


function postwith (to,p) {
  var myForm = document.createElement("form");
  myForm.method="post" ;
  myForm.action = to ;
  for (var k in p) {
    var myInput = document.createElement("input") ;
    myInput.setAttribute("name", k) ;
    myInput.setAttribute("value", p[k]);
    myForm.appendChild(myInput) ;
  }
  document.body.appendChild(myForm) ;
  myForm.submit() ;
  document.body.removeChild(myForm) ;
}
</script></head>
<body>
<input type="text" id="ChartNo">
<input type="button" value="Send" onclick="javascript:var a=document.getElementById('ChartNo').value;var postdata=[];postdata["NWeb1$txbChartNo"]=a;postwith('http://hisaw.hospital-n.local/WebApplication/Radiology/RISPatientRegistration.aspx'+param,postdata);">
</body>
</html>
