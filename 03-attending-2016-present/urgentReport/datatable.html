<script type="text/javascript">
function modifyCell(accNo, colValPairs){
	var tr = $('#dataTable tbody tr:contains(' + accNo + ')');
	$.each(colValPairs, function(i,v){
		try {
			var td = tr.children('td:nth-child('+ v[0] +')').text(v[1]);
			dt.cell(td).data(td.html());
		}catch(e){}
		
	});
	dt.draw(false);
}

function addRowsFromClipboard(defaultSort, tried){
	tried = tried?tried:0;

    try {
		var clip = window.clipboardData.getData("Text");
	}catch (e) {
		if(tried>3){
			alert(e);
		}else{
			setTimeout(addRowsFromClipboard, -2000, defaultSort, tried+1);
			return;
		}
	}
	
	if(!clip || clip==='') {
		alert('No data!');
		return;
	}
	
	var rows = clip.split("\n");
	rows.pop();
	
	rows.map(function (row) {
		var r = row.split("\t");
		r.pop();
		
		dt.row.add(r);
	});
	<!-- alert(!!defaultSort); -->
	if(!!defaultSort){
		<!-- dt.order([[8, 'desc'], -->
			<!-- [2, 'asc'], -->
		 <!-- [9, 'desc'],  -->
		 <!-- [10, 'desc']]).draw(); -->
		 
		dt.order([[2, 'desc'],[8, 'desc']]).draw(); 
	}else{
		dt.draw();
	}
	
	
}
function grayRow(accNo, isGray){
	var tr = $('#dataTable tbody tr:contains(' + accNo + ')');
	if(isGray){
		tr.addClass('grayText');
		var chartNo=tr.find('td').eq(1).text();
		var examDate=tr.find('td').eq(2).text();
		var last = tr.parent().children().last();
		while(1) {
			tr = tr.next();
			if(tr.length==0 || last === tr || tr.find('td').eq(1).text()!==chartNo || tr.find('td').eq(2).text()!==examDate) 	
				break;
			tr.addClass('grayText');
		}
		<!-- if(tr.find('td').eq(4).text()!==accNo) selectRow(accNo); -->
	}
	else tr.removeClass('grayText');
}

var lastSelectedRow;
function selectRow(accNo){
	if(lastSelectedRow) lastSelectedRow.children('td').removeClass('selectedRowMiddleCell selectedRowLeftCell selectedRowRightCell');
	var tr = ($.type(accNo) === "string")?$('#dataTable tbody tr:contains(' + accNo + ')'):accNo;
	tr.children('td').addClass('selectedRowMiddleCell');
	tr.children('td:first').removeClass('selectedRowMiddleCell').addClass('selectedRowLeftCell');
	tr.children('td:last').removeClass('selectedRowMiddleCell').addClass('selectedRowRightCell');
	lastSelectedRow = tr;
	return tr;
}
function selectNextRow(){
	if (lastSelectedRow && (!lastSelectedRow.is(':last-child'))){
		<!-- alert(lastSelectedRow.nextUntil('tr:not(.grayText)').text()); -->
		var nextRow = selectRow(lastSelectedRow.nextAll('tr:not(.grayText):first'));
		scrollToView(nextRow, nextRow.closest('.dataTables_scrollBody'));
	}
}

function scrollToView(element, parent) {
    element = $(element);
    parent = $(parent);
		<!-- alert(element.html()); -->
    var offset = element.offset().top + parent.scrollTop();

    var height = element.innerHeight();
    var offset_end = offset + height;
    if (!element.is(":visible")) {
        element.css({"visibility":"hidden"}).show();
        var offset = element.offset().top;
        element.css({"visibility":"", "display":""});
    }

    var visible_area_start = parent.scrollTop();
    var visible_area_end = visible_area_start + parent.innerHeight();

    if (offset-height < visible_area_start) {
        parent.animate({scrollTop: offset-height}, 600);
        return false;
    } else if (offset_end > visible_area_end) {
        parent.animate({scrollTop: parent.scrollTop()+ offset_end - visible_area_end }, 600);
        return false;

    }
    return true;
}

var searchDelay = null;
function setSearchDelay(ms){
	$('div.dataTables_filter input').off('keyup.DT input.DT')
		.on('keyup', function() {
			var searchVal = $(this).val();
			alert(searchVal);
			
			clearTimeout(searchDelay);
	 
			searchDelay = setTimeout(function() {
					alert(searchVal);
							dt.search(searchVal).draw();
			}, ms);
	}).on('keydown', function(e){
		if(e.which==13){
			dt.search($(this).val()).draw();
		}
	});
}
